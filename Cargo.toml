[package]
name = "tex-setup"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/hrchlhck/tex-setup"
readme = "README.md"
publish = false

[package.metadata]
configuration_filename = "versions"
configuration_directory_name = ".hrck_texsetup"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
cargo_toml = "1.0.1"
